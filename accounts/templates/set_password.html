{% load static %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <title>{% if title %} {{ title }} {% else %} Django Online Shop {% endif %}</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: none;
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 25px 0;
            border-bottom: none;
        }
        .card-header h4 {
            margin-bottom: 10px;
            font-weight: 600;
        }
        .card-header p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0;
        }
        .card-body {
            padding: 30px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .card-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .alert-danger {
            border-radius: 8px;
            background-color: rgba(220, 53, 69, 0.1);
            border: none;
            color: #dc3545;
        }
        .close {
            color: #dc3545;
        }
        .text-muted {
            color: #6c757d !important;
        }
        .custom-checkbox {
            margin-top: 15px;
            margin-bottom: 20px;
            display: block;
        }
        .custom-checkbox input {
            margin-left: 8px;
        }
        /* Pulse animation for button */
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }
        .pulse {
            animation: pulse 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    {% block content %}
    <div class="container password-container">
        <div class="card">
            <div class="card-header">
                <i class="fas fa-lock card-icon"></i>
                <h4>تنظیم رمز عبور</h4>
                <p>برای: {{ phone_number }}</p>
            </div>
            
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
                    <button type="button" class="close" data-dismiss="alert">
                        <span>&times;</span>
                    </button>
                </div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label for="password">رمز عبور</label>
                        <input type="password" 
                               class="form-control" 
                               name="password" 
                               required
                               minlength="8">
                        <small class="form-text text-muted">
                            حداقل ۸ کاراکتر
                        </small>
                    </div>
                    
                    <div class="form-group">
                        <label for="password_confirm">تکرار رمز عبور</label>
                        <input type="password" 
                               class="form-control" 
                               name="password_confirm" 
                               required
                               minlength="8">
                    </div>
                    
                    <div class="custom-checkbox">
                        <label for="is_manager">
                            <input type="checkbox" id="is_manager" name="is_manager"> فروشنده هستم
                        </label>
                    </div>
                    
                    <button type="submit" 
                            class="btn btn-primary btn-block">
                        <i class="fas fa-check-circle mr-2"></i>تکمیل ثبت نام
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}

    <!-- jQuery and Bootstrap 4 JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // Add animation to button
            $('.btn-primary').hover(
                function() { $(this).addClass('pulse'); },
                function() { $(this).removeClass('pulse'); }
            );
        });
    </script>
</body>
</html>
